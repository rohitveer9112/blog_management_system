{% extends 'base.html' %}{% block content %}<section class="narrow page-content"><h1>Contact messages</h1>{% for msg in messages_list %}<div class="form-card"><h3>{{ msg.subject }}</h3><p>{{ msg.name }} · {{ msg.email }} · {{ msg.created_at|date:'M j, Y' }}</p><p>{{ msg.message }}</p><form method="post" action="{% url 'admin_panel:toggle_message' msg.pk %}">{% csrf_token %}<button class="button secondary small">Mark {% if msg.is_read %}unread{% else %}read{% endif %}</button></form><form method="post" action="{% url 'admin_panel:delete_message' msg.pk %}">{% csrf_token %}<button class="button danger small">Delete</button></form></div>{% empty %}<p>No messages.</p>{% endfor %}</section>{% endblock %}
