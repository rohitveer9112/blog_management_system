{% extends 'base.html' %}{% block content %}<section class="narrow page-content"><h1>Categories</h1><form method="post" class="form-card">{% csrf_token %}{{ form.as_p }}<button class="button">Add category</button></form>{% for category in categories %}<div class="table-row"><strong>{{ category.name }}</strong><form method="post" action="{% url 'admin_panel:delete_category' category.pk %}">{% csrf_token %}<button class="button danger small">Delete</button></form></div>{% empty %}<p>No categories.</p>{% endfor %}</section>{% endblock %}
