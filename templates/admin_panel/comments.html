{% extends 'base.html' %}{% block content %}<section class="narrow page-content"><h1>Comments</h1>{% for comment in comments %}<div class="table-row"><div><strong>{{ comment.author.username }} on {{ comment.post.title }}</strong><small>{{ comment.body|truncatewords:24 }}</small></div><form method="post" action="{% url 'admin_panel:delete_comment' comment.pk %}">{% csrf_token %}<button class="button danger small">Delete</button></form></div>{% empty %}<p>No comments.</p>{% endfor %}</section>{% endblock %}
