<article class="post-card"><a class="post-thumb" href="{% url 'blogs:detail' post.slug %}">{% if post.featured_image %}<img src="{{ post.featured_image.url }}" alt="">{% else %}<div class="image-placeholder">I&amp;I</div>{% endif %}</a><div class="post-info"><span class="eyebrow">{{ post.category|default:'Journal' }}</span><h3><a href="{% url 'blogs:detail' post.slug %}">{{ post.title }}</a></h3><p>{{ post.content|striptags|truncatewords:18 }}</p><span class="byline">{{ post.author.get_full_name|default:post.author.username }} · {{ post.published_at|date:'M j, Y' }}</span></div></article>
